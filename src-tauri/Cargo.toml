[package]
name = "rush-locator"
version = "0.1.0"
description = "RUSH Locator — iPhone 虚拟定位工作台"
authors = ["RUSH"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rush_locator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
plist = "1"

idevice = { version = "0.1.68", default-features = false, features = [
  "ring",
  "usbmuxd",
  "tcp",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "rsd",
  "dvt",
  "location_simulation",
  "device_info",
  "diagnostics_relay",
  "tunneld",
] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
